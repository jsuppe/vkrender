name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The prebuilt FFmpeg zip (~70 MB) is the only non-FetchContent download;
      # cache it so CI doesn't hit the BtbN release on every run.
      - name: Cache FFmpeg prebuilt
        uses: actions/cache@v4
        with:
          path: build/ffmpeg-prebuilt/ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
          key: ffmpeg-n7.1-latest-win64-gpl-shared

      # No pinned generator: the runner image ships whichever Visual Studio
      # is current, and CMake's default picks it up.
      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/Release/*.exe dist/
          Copy-Item build/Release/*.dll dist/
          Copy-Item -Recurse build/Release/shaders dist/shaders

      - uses: actions/upload-artifact@v4
        with:
          name: vkrender-win64
          path: dist

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libavformat-dev libavcodec-dev libavutil-dev \
            libva-dev libdrm-dev \
            xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 4

      # No GPU on CI runners; the IPC/fd-passing self-test is the runnable part.
      - name: Test
        run: ctest --test-dir build --output-on-failure
