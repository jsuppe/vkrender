name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Match the renderer API to a reproducible FrameLink revision.
env:
  FRAMELINK_REF: 21d15d56e51e9c7e200f2b0d6481880b9af6dd45

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out FrameLink
        uses: actions/checkout@v4
        with:
          repository: jsuppe/framelink
          ref: ${{ env.FRAMELINK_REF }}
          path: deps/framelink
          persist-credentials: false


      # No pinned generator: the runner image ships whichever Visual Studio
      # is current, and CMake's default picks it up.
      - name: Cache GStreamer MSIs
        id: gst-cache
        uses: actions/cache@v4
        with:
          path: gst-msi
          key: gstreamer-msvc-1.26.11

      - name: Download GStreamer MSIs
        if: steps.gst-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory gst-msi | Out-Null
          curl.exe -sL -o gst-msi/runtime.msi https://gstreamer.freedesktop.org/data/pkg/windows/1.26.11/msvc/gstreamer-1.0-msvc-x86_64-1.26.11.msi
          curl.exe -sL -o gst-msi/devel.msi https://gstreamer.freedesktop.org/data/pkg/windows/1.26.11/msvc/gstreamer-1.0-devel-msvc-x86_64-1.26.11.msi

      - name: Install GStreamer
        shell: pwsh
        run: |
          $p1 = Start-Process msiexec -ArgumentList '/i',"$PWD\gst-msi\runtime.msi",'/qn','/norestart','ADDLOCAL=ALL' -Wait -PassThru
          Write-Host "runtime msi exit: $($p1.ExitCode)"
          $p2 = Start-Process msiexec -ArgumentList '/i',"$PWD\gst-msi\devel.msi",'/qn','/norestart','ADDLOCAL=ALL' -Wait -PassThru
          Write-Host "devel msi exit: $($p2.ExitCode)"
          Get-ChildItem C:\gstreamer -Recurse -Depth 2 -Directory -ErrorAction SilentlyContinue | Select-Object -First 5 -ExpandProperty FullName
          if ($p1.ExitCode -ne 0 -or $p2.ExitCode -ne 0) { exit 1 }
          # The runner process predates the MSI install: exporting the SDK for
          # compilation does not put its runtime DLLs on subsequent steps' PATH.
          $root = @('C:\gstreamer\1.0\msvc_x86_64','C:\Program Files\gstreamer\1.0\msvc_x86_64') | Where-Object { Test-Path "$_\lib\gstreamer-1.0.lib" } | Select-Object -First 1
          if (!$root -or !(Test-Path "$root\bin\gstreamer-1.0-0.dll")) { throw 'GStreamer development/runtime install not found' }
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$root" >> $env:GITHUB_ENV
          "$root\bin" >> $env:GITHUB_PATH

      - name: Configure
        run: cmake -S . -B build -A x64 -DFRAMELINK_DIR="${{ github.workspace }}/deps/framelink"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test portable control plane
        timeout-minutes: 5
        run: ctest --test-dir build -C Release --output-on-failure --timeout 60 -R "^(av_schedule|av_clock_contract|headless_pacer|nv12_cpu|shared_scene_layouts|shared_moderation|control_http|control_preview_admission|android_surface_generations|android_stream_owners|android_control_mailbox|android_control_aidl|preview_mailbox)$"

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/Release/*.exe dist/
          Copy-Item build/Release/*.dll dist/
          Copy-Item -Recurse build/Release/shaders dist/shaders

      # Uploaded only for a tag or an explicit manual run. Every push to master
      # used to publish ~160 MB of Android APKs plus a Windows bundle on the
      # 90-day default retention, which filled the account's artifact storage in
      # about a week and then failed EVERY upload with "Artifact storage quota
      # has been hit" - while the builds themselves passed. CI's job is to fail
      # loudly when the build breaks; it does that either way, and these outputs
      # are reproducible from any checkout.
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: vkrender-win64
          path: dist
          retention-days: 7

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out FrameLink
        uses: actions/checkout@v4
        with:
          repository: jsuppe/framelink
          ref: ${{ env.FRAMELINK_REF }}
          path: deps/framelink
          persist-credentials: false


      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            libva-dev libdrm-dev libgbm-dev \
            xorg-dev libwayland-dev libwayland-bin libxkbcommon-dev wayland-protocols

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFRAMELINK_DIR="$GITHUB_WORKSPACE/deps/framelink"

      - name: Build
        run: cmake --build build --parallel 4

      # No GPU on CI runners; the IPC/fd-passing self-test is the runnable part.
      - name: Test
        run: ctest --test-dir build --output-on-failure -R "^(av_schedule|av_clock_contract|headless_pacer|nv12_cpu|ipc|control_preview_short_write|shared_scene_layouts|shared_moderation|control_http|control_preview_admission|android_surface_generations|android_stream_owners|android_control_mailbox|android_control_aidl|preview_mailbox)$"

  # The sender is a Flutter app, so it builds and tests entirely outside the
  # CMake tree and needs its own job. Ubuntu is deliberate: the suite is pure
  # Dart over mocked platform channels, so it does not need Windows, a GPU, or
  # a display -- which is the whole point of testing the source picker this way
  # (see sender/test/source_picker_test.dart).
  sender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version the sender is developed against; `stable`
          # would silently move and turn an SDK change into a mystery failure
          # in an unrelated PR.
          flutter-version: 3.38.9
          channel: stable
          cache: true

      - name: Fetch packages
        working-directory: sender
        run: flutter pub get

      # Warnings are failures here: the app is small enough that a clean
      # analyze is achievable, so anything less means it has started to rot.
      - name: Analyze
        working-directory: sender
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        working-directory: sender
        run: flutter test --reporter expanded

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out FrameLink
        uses: actions/checkout@v4
        with:
          repository: jsuppe/framelink
          ref: ${{ env.FRAMELINK_REF }}
          path: deps/framelink
          persist-credentials: false


      # The WebRTC APK statically links the whole webrtcbin + Rust closure into
      # a ~350 MB RelWithDebInfo .so per ABI; on a cache miss the GStreamer
      # prune also extracts multi-GB trees. Reclaim ~10 GB of preinstalled
      # toolchains we don't use so the linker never hits ENOSPC.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk/2* \
            /usr/local/share/powershell /usr/local/share/chromium /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null

      # The 1.5 GB universal tarball is pruned to the ~130 MB/ABI static-link
      # closure before caching (scripts/fetch_gstreamer_android.sh).
      - name: Cache GStreamer Android prebuilts (pruned)
        id: gst-android-cache
        uses: actions/cache@v4
        with:
          path: android/gstreamer-android
          key: gstreamer-android-1.26.11-${{ hashFiles('scripts/fetch_gstreamer_android.sh') }}

      - name: Fetch GStreamer Android prebuilts
        if: steps.gst-android-cache.outputs.cache-hit != 'true'
        run: WORK_DIR="$RUNNER_TEMP/gstwork" bash scripts/fetch_gstreamer_android.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble APKs (renderer + decoder + airplay + webrtc)
        run: gradle -p android assembleDebug -PframelinkDir="$GITHUB_WORKSPACE/deps/framelink"

      # Tag/manual only, and short-lived - see the note on the Windows upload.
      # This job is the expensive one: 4.23 GB of the 4.90 GB that filled the
      # quota was Android APKs, at 139-161 MB per run.
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: vkrender-android
          retention-days: 7
          path: |
            android/renderer/build/outputs/apk/debug/renderer-debug.apk
            android/decoder/build/outputs/apk/*/debug/*.apk
            android/airplay/build/outputs/apk/debug/airplay-debug.apk
            android/webrtc/build/outputs/apk/debug/webrtc-debug.apk
